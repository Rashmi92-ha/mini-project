<div class="user-header">
  <h2>User Management</h2>
  <div class="user-actions">
    <p-iconField>
      <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
      <input
        pInputText
        type="text"
        [(ngModel)]="searchText"
        (input)="filteredUsers()"
        placeholder="Seach Users..."
      />
    </p-iconField>
    <i
      class="pi pi-user-plus add-user-icon"
      pTooltip="Add User"
      tooltipPosition="left"
      (click)="openDialog()"
    >
    </i>
  </div>
</div>

<p-table
  [value]="filteredUser"
  [loading]="loading"
  [paginator]="true"
  [rows]="5"
  [rowsPerPageOptions]="[5, 10, 20]"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Username</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.role }}</td>
      <td>
        <p-button
          icon="pi pi-pencil"
          severity="warning"
          [rounded]="true"
          [text]="true"
          (onClick)="editUser(user)"
        >
        </p-button>
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [rounded]="true"
          [text]="true"
          [loading]="loading"
          (onClick)="deleteUser(user._id)"
        ></p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="3" class="empty-state">No users found.</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="editId ? 'Edit User' : 'Add User'"
  [(visible)]="displayDialog"
  [modal]="true"
  [style]="{ width: '30rem' }"
>
  <form [formGroup]="userForm">
    <div class="field">
      <label>UserName</label>
      <input pInputText formControlName="username" />
    </div>
    @if (!editId) {
      <div class="field">
        <p-floatLabel>
          <input pInputText type="password" formControlName="password" />

          <label>Password</label>
        </p-floatLabel>
      </div>
    }
    <div class="field">
      <label>Role</label>
      <p-dropdown
        [options]="role"
        optionLabel="name"
        optionValue="value"
        formControlName="role"
      ></p-dropdown>
    </div>
    <div class="dialog-footer">
      <p-button
        label="Cancel"
        severity="secondary"
        (onClick)="closeDialog()"
      ></p-button>
      <p-button label="Save" (onClick)="onSubmit()"></p-button>
    </div>
  </form>
</p-dialog>
<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
