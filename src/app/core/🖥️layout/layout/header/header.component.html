
<p-menubar>
  <ng-template pTemplate="start">
    <div class="logo">🏢 Employee Management</div>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="header-right">
      <p-avatar label="R" shape="circle"></p-avatar>

      <button
        pButton
        type="button"
        (click)="confirmLogout()"
        label="Logout"
        icon="pi pi-sign-out"
      ></button>
    </div>
  </ng-template>
</p-menubar>
<p-confirmDialog key="logoutConfirm"></p-confirmDialog>
